<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="clock2.png">
    <title>Exam timers</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Modak&display=swap');
        @media screen and (max-width: 1100px){
            .timer{
                flex: 1;
                font-size: 2.5rem;
            }
        }
        
        html, body{
            background-color: #191919;
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        .timer{
            width: 20%;
            min-height: 35%; 
            margin: 1.5% 2.5% 1.5% 2.5%;
            padding-bottom: 2%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            min-width: 250px;
            background-color: #6E6E6E; 
            font-family: "Cherry Bomb One", system-ui;
            font-weight: 100;
            font-style: normal; 
            font-size: 2.5rem;
            color: white;
            text-align: center;
            -webkit-box-shadow: 5px 5px 15px 5px #000000;
            box-shadow: 5px 5px 15px 10px #000000;
            transition: transform 0.5s;
        }
        .timer:hover{
            transform: scale(1.15);
        }
        .hsc{
            background-color: red;
        }
        p{
            margin: 1rem;
        }
        a{
            color: rgb(62, 166, 255);
        }
        .subject{
            height: 40%;
        }
        .date{
            height: 30%;
        }
        .time{
            height: 20%;
        }
        .study{
            height: 10%;
        }
    </style>
</head>
<body>

    <div style="height: 100%; width: 100%; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center;">
        <div class="timer">
            <div class="subject"><p>English Paper 1</p></div>
            <div class="date"><p>13/10/2026<br>09:50</p></div>
            <div class="time" id="timer1" style="margin-bottom: 2%;"></div>
        </div>
        <div class="timer">
            <div class="subject"><p>English Paper 2</p></div>
            <div class="date"><p>14/10/2026<br>09:25</p></div>
            <div class="time" id="timer2"></div>
        </div>
        <div class="timer">
            <div class="subject"><p>Math Extension 2</p></div>
            <div class="date"><p>19/10/2026<br>13:50</p></div>
            <div class="time" id="timer3"></div>
        </div>
         <div class="timer">
            <div class="subject"><p>Math Extension 1</p></div>
            <div class="date"><p>23/10/2026<br>13:50</p></div>
            <div class="time" id="timer4"></div>
        </div>
        <div class="timer">
            <div class="subject"><p>Business Studies</p></div>
            <div class="date"><p>26/10/2026<br>09:25</p></div>
            <div class="time" id="timer5"></div>
        </div>
        <div class="timer">
            <div class="subject"><p>Enterprise Computing</p></div>
            <div class="date"><p>29/10/2026<br>09:50</p></div>
            <div class="time" id="timer6"></div>
        </div>
        <div class="timer">
            <div class="subject"><p>Physics</p></div>
            <div class="date"><p>05/11/2026<br>09:25</p></div>
            <div class="time" id="timer7"></div>
        </div>
    </div>

    <script>
        // Function to start both timers
        function startTimers() {
            let date1 = new Date('October 13, 2026 09:50:00');
            let date2 = new Date('October 14, 2026 09:25:00');
            let date3 = new Date('October 19, 2026 13:50:00');
            let date4 = new Date('October 23, 2026 13:50:00');
            let date5 = new Date('October 26, 2026 09:25:00');
            let date6 = new Date('October 29, 2026 09:50:00');
            let date7 = new Date('November14, 2026 09:25:00');

            // Call functions to start each timer
            createTimer(date1, 'timer1');
            createTimer(date2, 'timer2');
            createTimer(date3, 'timer3');
            createTimer(date4, 'timer4');
            createTimer(date5, 'timer5');
            createTimer(date6, 'timer6');
            createTimer(date7, 'timer7');
            createTimer(date8, 'timer8');
        }

        // Function to create a timer
        function createTimer(targetDate, elementId) {
            setInterval(function() {
                let currentTime = new Date();
                let timeLeft = targetDate - currentTime;

                if (timeLeft <= 0) {
                    document.getElementById(elementId).innerHTML = "Time's up!";
                } else {
                    let days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                    let hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    let minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    let seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                    document.getElementById(elementId).innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
                }
            }, 1000);
        }

        // Automatically start timers when the page loads
        window.onload = startTimers;
    </script>

</body>
</html>
